plugins {
    id 'java-library'
}

group = 'com.github.luben'
version = file('version').text.trim()

java {
    // semi-mite needs the Foreign Function & Memory API, final since JDK 22.
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 22
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

repositories {
    // Allows a locally published semi-mite (publishToMavenLocal) to be used
    // when the sibling project is not part of the build.
    mavenLocal()
    mavenCentral()
}

dependencies {
    // The native-interop framework: everything below the public API goes
    // through @MiteClient / semi-mite, with no JNI and no direct FFM usage.
    api 'io.github.krosta12:semi-mite:0.2.0'

    compileOnly 'org.jetbrains:annotations:24.1.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// Version class (was generated by the sbt build)
// ---------------------------------------------------------------------------

def generatedVersionDir = layout.buildDirectory.dir('generated/sources/zstdVersion')

def generateZstdVersion = tasks.register('generateZstdVersion') {
    def outputDir = generatedVersionDir
    def projectVersion = project.version.toString()
    outputs.dir(outputDir)
    doLast {
        def packageDir = outputDir.get().dir('com/github/luben/zstd/util').asFile
        packageDir.mkdirs()
        new File(packageDir, 'ZstdVersion.java').text = """package com.github.luben.zstd.util;

public class ZstdVersion {
    public static final String VERSION = "${projectVersion}";
}
"""
    }
}

sourceSets.main.java.srcDir(generatedVersionDir)
tasks.named('compileJava') {
    dependsOn generateZstdVersion
}

// ---------------------------------------------------------------------------
// Native library (the vendored zstd sources + the semi-mite bridge)
// ---------------------------------------------------------------------------

def osName = {
    def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    if (os.startsWith('windows')) return 'win'
    if (os.startsWith('mac')) return 'darwin'
    return os.replace(' ', '_')
}

def archName = {
    def arch = System.getProperty('os.arch')
    if (arch == 'amd64' && osName() == 'darwin') return 'x86_64'
    return arch
}

def sharedLibraryExtension = {
    if (osName() == 'win') return 'dll'
    if (osName() == 'darwin') return 'dylib'
    return 'so'
}

def nativeOutputDir = layout.buildDirectory.dir("native/${osName()}/${archName()}")
def nativeLibraryName = "libzstd-mite.${sharedLibraryExtension()}"
def nativeLibraryFile = nativeOutputDir.map { it.file(nativeLibraryName) }

def cCompiler = {
    def fromEnv = System.getenv('CC')
    if (fromEnv != null && !fromEnv.isBlank()) return fromEnv
    return osName() == 'darwin' ? 'clang' : 'gcc'
}

def nativeSources = {
    def sources = fileTree('src/main/native') { include '**/*.c' }.files
    // huf_decompress_amd64.S is GNU/ELF assembly and is not assembled by the
    // Windows toolchains; the C fallback is used there.
    if (osName() != 'win') {
        sources += fileTree('src/main/native') { include '**/*.S' }.files
    }
    return sources
}

def nativeCompileArgs = {
    def args = []
    args << cCompiler()
    args << '-shared'
    args << '-O3'
    if (osName() != 'win') {
        args << '-fPIC'
    }
    args << '-DZSTD_MULTITHREAD=1'
    args << "-I${file('src/main/native').absolutePath}"
    args << "-I${file('src/main/native/common').absolutePath}"
    args << "-I${file('src/main/native/compress').absolutePath}"
    args << "-I${file('src/main/native/decompress').absolutePath}"
    args << "-I${file('src/main/native/dictBuilder').absolutePath}"
    if (osName() == 'win') {
        // No GAS assembly is used on Windows; keep the portable C implementation.
        args << '-DZSTD_DISABLE_ASM=1'
        args << '-static-libgcc'
    } else {
        // ZSTD_MULTITHREAD uses pthreads on POSIX platforms.
        args << '-pthread'
    }
    args.addAll(nativeSources().collect { it.absolutePath })
    args << '-o'
    args << nativeLibraryFile.get().asFile.absolutePath
    return args
}

def nativeLibrary = tasks.register('nativeLibrary', Exec) {
    group = 'build'
    description = 'Builds the zstd-mite shared library for the current platform'
    outputs.file(nativeLibraryFile)
    inputs.files(nativeSources())
    inputs.files(fileTree('src/main/native') { include '**/*.h' })
    doFirst {
        nativeOutputDir.get().asFile.mkdirs()
        logger.lifecycle("Compiling native library: ${nativeLibraryFile.get().asFile}")
    }
    commandLine nativeCompileArgs()
}

// Package the current platform's native library in the jar, under the path the
// runtime Native class looks up: /<os>/<arch>/libzstd-mite.<ext>
tasks.named('processResources') {
    dependsOn nativeLibrary
    from(nativeOutputDir) {
        into("${osName()}/${archName()}")
    }
}

tasks.named('jar') {
    dependsOn nativeLibrary
    manifest {
        attributes(
                'Automatic-Module-Name': 'com.github.luben.zstd',
                'Implementation-Title': 'zstd-jni (semi-mite)',
                'Implementation-Version': project.version
        )
    }
}

// ---------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------

tasks.named('test') {
    dependsOn nativeLibrary
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'ZstdNativePath', nativeLibraryFile.get().asFile.absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
