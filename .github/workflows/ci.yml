name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# zstd-jni now calls libzstd through semi-mite (no JNI, no Project Panama
# bindings of its own). The native library is built from the vendored zstd
# sources by Gradle, then the Java test suite runs against it.
#
# semi-mite is checked out next to the project and consumed through the
# composite build (`-PsemiMiteProject=...`), so CI always builds against the
# current semi-mite sources. Publishing semi-mite to Maven Central and dropping
# the checkout is enough to simplify this later.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout semi-mite
        uses: actions/checkout@v7
        with:
          repository: krosta12/semi-mite
          path: semi-mite

      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Build native library and run tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PsemiMiteProject=semi-mite test jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore
